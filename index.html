
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora científica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="header">
      <div>
        <h1>CALC-X</h1>
        <p>CALCULADORA CIENTÍFICA</p>
      </div>
      <button id="angle" class="mode">DEG</button>
    </header>

    <section class="screen">
      <div id="history">Listo para calcular</div>
      <input
        id="display"
        type="text"
        value="0"
        aria-label="Pantalla de la calculadora"
        readonly
      >
    </section>

    <section class="buttons">
      <button data-value="sin(">sin</button>
      <button data-value="cos(">cos</button>
      <button data-value="tan(">tan</button>
      <button data-value="sqrt(">√</button>

      <button data-value="(">(</button>
      <button data-value=")">)</button>
      <button data-value="^2">x²</button>
      <button data-value="^">xʸ</button>

      <button data-value="log(">log</button>
      <button data-value="ln(">ln</button>
      <button data-value="pi">π</button>
      <button data-value="e">e</button>

      <button data-action="clear" class="danger">AC</button>
      <button data-action="delete">DEL</button>
      <button data-value="%">%</button>
      <button data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="+">+</button>

      <button data-value="(">(</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button data-action="equals" class="equals">=</button>
    </section>

    <footer>CALC-X · SCIENTIFIC SERIES</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
